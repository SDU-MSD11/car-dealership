name: Test Flow

on:
  pull_request:
    branches: 
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-flow-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.x
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test:ci
      
      - name: Expo Android bundle smoke test
        run: npx expo export --platform android --output-dir dist